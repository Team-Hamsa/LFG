<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-label="LFG system architecture: four client surfaces (Discord bot, Discord Activity, Telegram bot + Mini App, and the web app at build.letseffinggo.com) plus the X funnel path all call the shared lfg_service backend, which runs the session state machines over lfg_core (bulk_mint_flow, economy_flow, market_flow, mint_flow, shop_flow, swap_flow). A separate listener process group streams the Clio transaction feed into per-network SQLite stores. External systems: XRP Ledger (Clio + rippled), Xaman (XUMM) signing, and BunnyCDN + IPFS hosting.">
