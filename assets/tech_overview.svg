  <path d="M672,266 L688,266" fill="none" stroke="#9C9A94" stroke-width="2" stroke-linecap="round"/>
  <polygon points="688,261 688,271 696,266" fill="#9C9A94"/>
  <rect x="698" y="253" width="154" height="26" rx="13" fill="#181818" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="775" y="270" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#F5F4F1">fully-animated avatars</text>

  <!-- STRIP 3: ledger-native -->
  <rect x="29" y="310" width="842" height="64" rx="12" fill="#202020" stroke="#2C2C2C" stroke-width="1"/>
  <rect x="45" y="324" width="6" height="36" rx="3" fill="#4890C0"/>
  <text x="61" y="337" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#F5F4F1">Ledger-native by design</text>
  <text x="61" y="355" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9C9A94">indexes the ledger directly</text>
