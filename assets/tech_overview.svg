<svg xmlns="http://www.w3.org/2000/svg" width="900" height="504" viewBox="0 0 900 504" role="img" aria-label="LFG under the hood: five client surfaces on one aiohttp hub, ~4,100 live editions grown from 3,535, live on XRPL mainnet since July 10, every transaction signed in Xaman. Every mint burns 1 LFGO through one of three paths: holders burn 1 LFGO directly; XRP payers fund a cross-currency Payment that buys 1 LFGO through XRPL DEX/AMM liquidity and burns it; sponsored free mints burn 1 LFGO from the project Treasury. A declarative engine composites avatars with FFmpeg, Pillow and OpenCV. Trait swaps use NFTokenModify (XLS-46), the marketplace runs on native NFTokenOffers, and per-network SQLite databases index the ledger. Every mint gets a Share-on-X card that opens the PWA inside X's own browser.">
  <!-- sticker shadow + card -->
  <rect x="8" y="8" width="884" height="488" rx="18" fill="#0A0A0A"/>
  <rect x="2" y="2" width="884" height="488" rx="18" fill="#181818" stroke="#FFFFFF" stroke-width="3"/>

  <!-- header -->
  <text x="29" y="38" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="900"><tspan fill="#F0D848">LFG</tspan><tspan fill="#F5F4F1"> under the hood</tspan></text>
  <text x="871" y="36" text-anchor="end" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#9C9A94">Python 3.10+ &#183; aiohttp &#183; discord.py &#183; xrpl-py &#183; XUMM SDK</text>

  <!-- stat tiles -->
  <rect x="29" y="56" width="200" height="66" rx="12" fill="#202020" stroke="#2C2C2C" stroke-width="1"/>
