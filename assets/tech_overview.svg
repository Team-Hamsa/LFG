  <rect x="740" y="164" width="104" height="28" rx="14" fill="none" stroke="#D84830" stroke-width="2"/>
  <text x="792" y="183" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="900" fill="#D84830">BURNED</text>

