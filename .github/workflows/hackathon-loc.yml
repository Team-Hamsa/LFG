name: Hackathon LoC stats

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hackathon-loc
  cancel-in-progress: true

jobs:
  update-loc:
    runs-on: ubuntu-latest
    # Skip the run triggered by this workflow's own README commit
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update README LoC block
        run: python3 scripts/hackathon_loc.py

      - name: Demo GIF staleness report (advisory)
        # Advisory only — exits 0 unless a README-referenced GIF is missing
        # from disk. Prints a per-GIF lag table when webapp/client/ has moved
        # past the captures by more than the grace window.
        run: python3 scripts/check_demo_staleness.py

      - name: Update repo-vitals dashboard
        run: python3 -m scripts.readme_dashboard

      - name: Update README badge row
        run: python3 -m scripts.readme_badges

      - name: Update README feature-flags table
        run: python3 -m scripts.readme_features

      - name: Update architecture diagram
        run: python3 -m scripts.render_architecture_svg

      - name: Update SourceTag badge
        # metrics/sourcetag.json is pushed nightly by a separate pm2 job, not
        # this workflow — if it's missing or malformed, that's a real problem
        # to surface, but it must not fail this job and block the unrelated
        # README LoC / dashboard commits below.
        continue-on-error: true
        run: python3 -m scripts.render_sourcetag_svg

      - name: Commit if changed
        run: |
          git add README.md assets/hackathon_loc.svg assets/dashboard.svg assets/sourcetag.svg assets/architecture.svg
          if ! git diff --quiet --cached; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # NOTE: no `[skip ci]` here. A `[skip ci]` HEAD commit skips the
            # entire push's workflows, and because promote.sh fast-forwards
            # `deploy` to `main` (whose HEAD is nearly always this bot commit),
            # it silently no-op'd the Pages deploy on every promote. CI is kept
            # off doc commits via ci.yml's paths-ignore instead; this workflow
            # won't re-trigger itself (guarded by the github-actions[bot] actor
            # check above).
            git commit -m "docs(README): refresh hackathon LoC stats"
            # Rebase-and-retry: this job races every other push to main, and a
            # plain `git push` fails outright ("cannot lock ref ... is at X but
            # expected Y") whenever anything else lands first -- 7 of the last
            # 15 runs failed that way, purely from merges landing close
            # together, leaving a red X on a green branch. The regenerated
            # stats are a pure function of the tree, so rebasing and retrying
            # is always safe: there is nothing to reconcile, only a newer base
            # to recompute against.
            for attempt in 1 2 3 4 5; do
              if git push; then exit 0; fi
              echo "push rejected (attempt $attempt); rebasing onto the new main"
              git pull --rebase --autostash origin main || exit 1
            done
            echo "::error::could not push refreshed stats after 5 attempts"
            exit 1
          fi
