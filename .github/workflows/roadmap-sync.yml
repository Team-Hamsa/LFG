name: README roadmap sync

on:
  schedule:
    - cron: "45 0 * * *"
  issues:
    types: [closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: roadmap-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # Only issue events involving the roadmap label matter; schedule and
    # manual runs always proceed.
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'roadmap') ||
      github.event.label.name == 'roadmap'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Sync roadmap block from roadmap-labelled issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.readme_roadmap

      - name: Hackathon freeze guard
        # This job pushes with GITHUB_TOKEN, which triggers no other workflow,
        # so hackathon-freeze.yml never sees its commit. Check before committing.
        run: |
          python -m pip install --quiet pytest
          python -m pytest --noconftest -p no:cacheprovider -q tests/test_hackathon_freeze.py

      - name: Commit if changed
        run: |
          git add README.md
          if ! git diff --quiet --cached; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # No `[skip ci]` — see readme-sync.yml for why (it silently
            # no-op'd Pages deploys on promote). ci.yml ignores README-only
            # commits via paths-ignore, and none of this workflow's triggers
            # fire on push, so it cannot retrigger itself.
            git commit -m "docs(README): sync roadmap from issue state"
            # main can move between checkout and push (deploys, other bots) —
            # rebase our one doc commit and retry instead of failing the sync.
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              git pull --rebase origin main
            done
            git push
          fi
