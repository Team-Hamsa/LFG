# Dependency updates arrive as PRs that go through the same ruff/mypy/gitleaks/
# pytest gate as any other change, instead of landing unannounced on the next
# fresh install. requirements.txt / requirements-dev.txt pin every direct
# dependency with `==` (see the header in those files), which is what makes
# these bumps reviewable one at a time.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # One PR per ecosystem-week keeps the review-bot budget sane; security
    # advisories still open their own PR outside these groups.
    groups:
      python-runtime:
        patterns: ["*"]
        exclude-patterns: ["mypy", "ruff", "pre-commit", "pytest*", "types-*"]
      python-dev-tooling:
        patterns: ["mypy", "ruff", "pre-commit", "pytest*", "types-*"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(ci)"
